services:
  api:
    build:
      context: .
      dockerfile: Containerfile
    ports:
      - "8000:8000"
    env_file: .env
    environment:
      DATABASE_URL: postgresql://hello:hello-dev-password@db:5432/hello
    depends_on:
      db:
        condition: service_healthy

  db:
    image: docker.io/library/postgres:17
    environment:
      POSTGRES_USER: hello
      POSTGRES_PASSWORD: hello-dev-password
      POSTGRES_DB: hello
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hello -d hello"]
      interval: 2s
      timeout: 3s
      retries: 15

volumes:
  pgdata:
