# Traffic from the company network to the Service, through an AWS Application Load Balancer
# (AWS Load Balancer Controller). Your team may use a Gateway API HTTPRoute instead; same questions.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: sheet-tool
  annotations:
    alb.ingress.kubernetes.io/scheme: internal              # not reachable from the internet
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTPS": 443}]'
    alb.ingress.kubernetes.io/healthcheck-path: /health/ready
    alb.ingress.kubernetes.io/load-balancer-attributes: idle_timeout.timeout_seconds=120   # longest upload
spec:
  ingressClassName: alb
  rules:
    - host: sheet-tool.internal.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: sheet-tool
                port:
                  name: http
