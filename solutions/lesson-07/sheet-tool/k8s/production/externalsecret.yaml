# The External Secrets Operator copies the key from AWS Secrets Manager into the
# Secret "sheet-tool-secrets", which the Deployment reads. Nothing secret is in Git.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: sheet-tool-secrets
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: aws-secrets-manager      # set up once by your team
  target:
    name: sheet-tool-secrets
  data:
    - secretKey: OPENROUTER_API_KEY
      remoteRef:
        key: sheet-tool/openrouter-api-key
