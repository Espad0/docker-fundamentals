# Lets the pods use an IAM role that may read and write the settings file (IRSA).
# With EKS Pod Identity there's no annotation: your team links the role to this ServiceAccount in AWS.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: sheet-tool
  annotations:
    eks.amazonaws.com/role-arn: arn:aws:iam::123456789012:role/sheet-tool-production
