apiVersion: v1
kind: ConfigMap
metadata:
  name: hello-ai-config
data:
  MODEL_NAME: keyword-sentiment-v1
---
apiVersion: v1
kind: Secret
metadata:
  name: hello-ai-secrets
type: Opaque
stringData:
  API_KEY: not-a-real-key
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: hello-ai
  labels:
    app: hello-ai
spec:
  replicas: 2
  selector:
    matchLabels:
      app: hello-ai
  template:
    metadata:
      labels:
        app: hello-ai
    spec:
      containers:
        - name: api
          image: localhost/hello-ai:2.0
          ports:
            - containerPort: 8000
              hostPort: 8080
          envFrom:
            - configMapRef:
                name: hello-ai-config
          env:
            - name: API_KEY
              valueFrom:
                secretKeyRef:
                  name: hello-ai-secrets
                  key: API_KEY
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 512Mi
          livenessProbe:
            exec:
              command: ["python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2)"]
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: hello-ai
spec:
  selector:
    app: hello-ai
  ports:
    - port: 80
      targetPort: 8000
